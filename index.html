function calcWeaknesses(types) {
  const eff = {};
  for (const atk of Object.keys(TYPE_COLORS)) {
    let m = 1;
    for (const def of types) m *= TYPE_CHART[atk]?.[def] ?? 1;
    if (m !== 1) eff[atk] = m;
  }
  return eff;
}

// ─── EXAKTE GEN V FORMEL (Bulbapedia) ────────────────────────────────────────
// darkGrass-Multiplikator abhängig von gefangenen Pokémon im Pokédex
const DARK_GRASS_MULT = [
  [601, 4096/4096],   // >600  → 1.0
  [451, 3686/4096],   // 451-600 → ~0.9
  [301, 3277/4096],   // 301-450 → ~0.8
  [151, 2867/4096],   // 151-300 → ~0.7
  [30,  2048/4096],   // 30-150  → 0.5
  [0,   1229/4096],   // <30     → ~0.3
];
function darkGrassFactor(caught) {
  for (const [min, mult] of DARK_GRASS_MULT) {
    if (caught >= min) return mult;
  }
  return 1229/4096;
}

// Korrekte Gen-V Catch-Formel:
// a = floor( (3×MaxHP - 2×CurHP)/(3×MaxHP) × 4096 × darkGrass × rate × ballBonus ) × statusBonus
// b = floor( 65536 × (a/1044480)^(1/4) )
// p(fangen) = (b/65535)^3  [3 Shake-Checks, nicht 4!]
// Garantierter Fang wenn a ≥ 1044480
function calcCatch(catchRate, ballMult, hpPct, statusBonus, darkGrass) {
  const maxHP = 100;
  const curHP = Math.max(1, hpPct);
  // HP-Faktor × 4096 für interne Präzision, dann darkGrass + ballBonus
  const hpFactor = ((3 * maxHP - 2 * curHP) / (3 * maxHP)) * 4096;
  // Standard-Rundung (round half up) für darkGrass und ballBonus laut Bulbapedia
  const a_raw = Math.floor(hpFactor * darkGrass * catchRate * ballMult) * statusBonus;
  const a = Math.floor(a_raw);
  // Garantierter Fang
  if (a >= 1044480) return 99.9;
  // b = floor(65536 × (a/1044480)^0.25)
  const b = Math.floor(65536 * Math.pow(Math.max(0, a) / 1044480, 0.25));
  // p(ein Shake) = b/65535, p(fangen) = p(shake)^3
  const pShake = Math.min(1, b / 65535);
  return Math.min(99.9, Math.max(0, Math.pow(pShake, 3) * 100));
}

// pokemondb URL-Name: lowercase, Sonderzeichen raus, Leerzeichen → Bindestrich
// Sonderfälle: mr-mime, farfetchd, nidoran-f, nidoran-m, etc.
function toDbName(enName) {
  return enName
    .toLowerCase()
    .replace(/♀/g, "-f").replace(/♂/g, "-m")
    .replace(/['.:\u2019]/g, "")
    .replace(/\s+/g, "-");
}

// Lookup: pokémon-id → komplette Kette
function collectIds(chain) {
  const ids = [];
  for (const stage of chain) {
    if (stage.branches) stage.branches.forEach(b => ids.push(b.id));
    else if (stage.id) ids.push(stage.id);
  }
  return ids;
}
const EVO_MAP = {};
for (const chain of EVO_CHAINS) {
  for (const id of collectIds(chain)) {
    EVO_MAP[id] = chain;
  }
}

  const links = [];
  for (const [item, wikiSlug] of Object.entries(ITEM_WIKI)) {
    if (cond.includes(item)) {
      links.push({ item, url: `https://www.pokewiki.de/${wikiSlug}` });
    }
  }
  return links.length > 0 ? links : null;
}

// Sprite-Komponente für Evo-Chain — klickbar, springt zum Pokémon
function EvoSprite({ pkmnId, highlight, onSelect }) {
  const pk = BW2_POKEMON.find(x => x[0] === pkmnId);
  if (!pk) return null;
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"4px" }}>
      <div
        onClick={() => onSelect && onSelect(pk)}
        style={{
          borderRadius:"8px", padding:"4px", cursor: onSelect ? "pointer" : "default",
          background: highlight ? "rgba(255,227,78,0.15)" : "transparent",
          border: highlight ? "1px solid rgba(255,227,78,0.4)" : "1px solid rgba(255,255,255,0.04)",
          transition:"all 0.15s",
        }}
        title={highlight ? "" : `${pk[2]} auswählen`}
      >
        <img
          src={`https://img.pokemondb.net/sprites/black-white/normal/${toDbName(pk[1])}.png`}
          alt={pk[2]}
          style={{ width:48, height:48, imageRendering:"pixelated", display:"block" }}
          onError={e => { e.target.src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pk[0]}.png`; }}
        />
      </div>
      <span style={{ fontSize:"0.6rem", color: highlight?"#c8a840":"#8a9aaa", fontFamily:"Space Grotesk,sans-serif", fontWeight: highlight?700:400, textAlign:"center", letterSpacing:"0.02em", cursor: onSelect?"pointer":"default" }}
        onClick={() => onSelect && onSelect(pk)}>
        {pk[2]}
      </span>
    </div>
  );
}

function EvoChainDisplay({ currentId, onSelect }) {
  const chain = EVO_MAP[currentId];
  if (!chain || chain.length <= 1) return null;

  const stages = [];
  for (let i = 0; i < chain.length; i++) {
    const stage = chain[i];
    if (i > 0) {
      const cond = stage.branches ? stage.branches[0].cond : stage.cond;
      const itemLinks = getItemLinks(cond);
      stages.push(
        <div key={`arrow-${i}`} style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"0 4px", flexShrink:0 }}>
          <span style={{ color:"#c8a840", fontSize:"1rem", lineHeight:1 }}>→</span>
          {cond && (
            <div style={{ fontSize:"0.55rem", color:"#6a5820", fontFamily:"Inter,sans-serif", textAlign:"center", maxWidth:"72px", marginTop:"2px", lineHeight:1.3 }}>
              {cond}
              {itemLinks && itemLinks.map(({item, url}) => (
                <a key={item} href={url} target="_blank" rel="noopener noreferrer"
                  style={{ display:"block", color:"#5090b0", fontSize:"0.5rem", textDecoration:"none", marginTop:"1px" }}>
                  📖 {item}
                </a>
              ))}
            </div>
          )}
        </div>
      );
    }
    if (stage.branches) {
      stages.push(
        <div key={`branch-${i}`} style={{ display:"flex", flexDirection:"column", gap:"6px" }}>
          {stage.branches.map((b, bi) => (
            <div key={bi} style={{ display:"flex", alignItems:"center", gap:"4px" }}>
              {bi > 0 && (
                <div style={{ fontSize:"0.5rem", color:"#6a5820", fontFamily:"Inter,sans-serif", maxWidth:"60px", lineHeight:1.2 }}>
                  {b.cond}
                  {getItemLinks(b.cond)?.map(({item,url}) => (
                    <a key={item} href={url} target="_blank" rel="noopener noreferrer"
                      style={{ display:"block", color:"#5090b0", textDecoration:"none" }}>📖 {item}</a>
                  ))}
                </div>
              )}
              <EvoSprite pkmnId={b.id} highlight={b.id === currentId} onSelect={onSelect} />
            </div>
          ))}
        </div>
      );
    } else {
      stages.push(<EvoSprite key={`stage-${i}`} pkmnId={stage.id} highlight={stage.id === currentId} onSelect={onSelect} />);
    }
  }

  return (
    <div style={{ marginTop:"8px", background:"rgba(255,227,78,0.04)", border:"1px solid rgba(255,227,78,0.12)", borderRadius:"6px", padding:"10px 12px" }}>
      <div style={{ fontSize:"0.55rem", color:"#6a5820", letterSpacing:"0.1em", fontFamily:"Inter,sans-serif", marginBottom:"8px" }}>ENTWICKLUNGSKETTE — Sprite anklicken zum Wechseln</div>
      <div style={{ display:"flex", alignItems:"center", gap:"4px", flexWrap:"wrap" }}>
        {stages}
      </div>
    </div>
  );
}

const TYP_ICON = { grass:"🌿", water:"🎣", cave:"🪨", static:"⭐", gift:"🎁" };
const TYP_LABEL = { grass:"Gras", water:"Wasser/Angel", cave:"Höhle/Gebäude", static:"Statisch", gift:"Geschenk" };

function RoutenTab() {
  // Zustand im localStorage speichern
  const STORAGE_KEY = "nuzlocke_bw2_routen";
  const loadState = () => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
  };
  const [checked, setChecked] = useState(loadState);
  const [filter, setFilter] = useState("all"); // all/open/done

  const toggle = (id) => {
    const next = { ...checked };
    if (next[id]) delete next[id];
    else next[id] = true;
    setChecked(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch {}
  };

  const reset = () => {
    if (confirm("Alle Häkchen zurücksetzen?")) {
      setChecked({});
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
    }
  };

  const done = Object.keys(checked).length;
  const total = ROUTEN.length;

  const filtered = ROUTEN.filter(r => {
    if (filter === "open") return !checked[r.id];
    if (filter === "done") return checked[r.id];
    return true;
  });

  // Gruppieren nach typ
  const groups = { grass:[], water:[], cave:[], static:[], gift:[] };
  for (const r of filtered) { if (groups[r.typ]) groups[r.typ].push(r); }

  return (
    <div>
      {/* Progress */}
      <div style={{ background:"#131720", border:"1px solid rgba(255,255,255,0.06)", borderRadius:"10px", padding:"14px 16px", marginBottom:"14px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"8px" }}>
          <span style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, color:"#E8F0FF", fontSize:"0.9rem" }}>
            {done} / {total} Locations
          </span>
          <button onClick={reset} style={{ background:"none", border:"1px solid rgba(214,64,69,0.3)", borderRadius:"4px", color:"#D64045", fontSize:"0.6rem", padding:"3px 8px", cursor:"pointer", fontFamily:"Inter,sans-serif" }}>
            Reset
          </button>
        </div>
        <div style={{ background:"#0c0f15", borderRadius:"4px", height:"6px", overflow:"hidden" }}>
          <div style={{ width:`${(done/total)*100}%`, height:"100%", background:"#4CAF7D", borderRadius:"4px", transition:"width 0.3s ease" }}/>
        </div>
      </div>

      {/* Filter */}
      <div style={{ display:"flex", gap:"5px", marginBottom:"14px" }}>
        {[["all","Alle"],["open","Offen"],["done","Erledigt"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{
            padding:"5px 12px", borderRadius:"5px", fontSize:"0.68rem",
            fontFamily:"Space Grotesk,sans-serif", fontWeight:600, cursor:"pointer",
            border: filter===v?"1px solid rgba(255,227,78,0.4)":"1px solid rgba(255,255,255,0.07)",
            background: filter===v?"rgba(255,227,78,0.1)":"rgba(255,255,255,0.03)",
            color: filter===v?"#FFE34E":"#5a6880",
          }}>{l}</button>
        ))}
      </div>

      {/* Gruppen */}
      {Object.entries(groups).map(([typ, routes]) => {
        if (!routes.length) return null;
        return (
          <div key={typ} style={{ marginBottom:"16px" }}>
            <div style={{ fontSize:"0.6rem", color:"#3a4860", letterSpacing:"0.12em", fontFamily:"Inter,sans-serif", marginBottom:"8px" }}>
              {TYP_ICON[typ]} {TYP_LABEL[typ].toUpperCase()}
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
              {routes.map(r => (
                <div key={r.id}
                  onClick={() => toggle(r.id)}
                  style={{
                    display:"flex", alignItems:"center", gap:"10px", padding:"9px 12px",
                    background: checked[r.id] ? "rgba(76,175,125,0.08)" : "#131720",
                    border: checked[r.id] ? "1px solid rgba(76,175,125,0.25)" : "1px solid rgba(255,255,255,0.05)",
                    borderRadius:"7px", cursor:"pointer", transition:"all 0.15s",
                  }}>
                  {/* Checkbox */}
                  <div style={{
                    width:"18px", height:"18px", borderRadius:"4px", flexShrink:0,
                    border: checked[r.id] ? "none" : "2px solid #2a3850",
                    background: checked[r.id] ? "#4CAF7D" : "transparent",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:"0.7rem", color:"#fff",
                  }}>
                    {checked[r.id] ? "✓" : ""}
                  </div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:600, fontSize:"0.82rem",
                      color: checked[r.id] ? "#5ddb99" : "#c0cfe0",
                      textDecoration: checked[r.id] ? "line-through" : "none",
                    }}>{r.name}</div>
                    {r.note && <div style={{ fontSize:"0.58rem", color:"#3a4860", fontFamily:"Inter,sans-serif", marginTop:"1px" }}>{r.note}</div>}
                  </div>
                  {typ==="static" && <span style={{ fontSize:"0.6rem", color:"#FFE34E", fontFamily:"Inter,sans-serif" }}>★</span>}
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function NuzlockeHelper() {
  const [query,    setQuery]    = useState("");
  const [activeTab, setActiveTab] = useState("dex"); // "dex" | "bosse"
  const [selected, setSelected] = useState(null);
  const [hpPct,    setHpPct]    = useState(50);
  const [status,   setStatus]   = useState("none");
  const [ball,     setBall]     = useState("poke");
  const [isWater,   setIsWater]   = useState(false);
  const [isCave,    setIsCave]    = useState(false);
  const [firstTurn, setFirstTurn] = useState(false);
  const [owned,     setOwned]     = useState(false);
  const [turn,      setTurn]      = useState(1);
  const [darkGrass, setDarkGrass] = useState(false);
  const [caught,    setCaught]    = useState(100);
  const [showList,  setShowList]  = useState(true);

  const filtered = useMemo(() => {
    if (!query.trim()) return [];
    const q = query.toLowerCase().trim();
    return BW2_POKEMON.filter(([id,en,de]) =>
      de.toLowerCase().includes(q) || en.toLowerCase().includes(q) || String(id)===q
    ).slice(0,10);
  }, [query]);

  const p = selected;
  const weaknesses = p ? calcWeaknesses(p[5]) : {};
  const w4  = Object.entries(weaknesses).filter(([,v])=>v>=4);
  const w2  = Object.entries(weaknesses).filter(([,v])=>v===2);
  const res = Object.entries(weaknesses).filter(([,v])=>v>0&&v<1);
  const imm = Object.entries(weaknesses).filter(([,v])=>v===0);

  const selectedBall = BALLS.find(b=>b.id===ball);
  const ctx = { types: p?.[5]||[], isWater, isCave, firstTurn, owned, turn };
  const ballMult = p && selectedBall ? selectedBall.mult(ctx) : 1;
  const dgFactor = darkGrass ? darkGrassFactor(caught) : 1;
  const catchPct = p && !selectedBall?.master
    ? calcCatch(p[3], ballMult, hpPct, STATUS_BONUS[status], dgFactor)
    : p ? 100 : null;

  // ── Schnell-Presets ──────────────────────────────────────────────────────
  const PRESETS = [
    { label:"1 KP · Schlaf",    hp:1,  status:"sleep" },
    { label:"1 KP · kein",      hp:1,  status:"none" },
    { label:"25% · Schlaf",     hp:25, status:"sleep" },
    { label:"50% · kein",       hp:50, status:"none" },
    { label:"Volle KP · kein",  hp:100,status:"none" },
  ];

  const pctColor = catchPct==null?"#888":catchPct>60?"#4CAF7D":catchPct>25?"#F5A623":"#D64045";

  const chip = (active) => ({
    padding:"5px 10px", borderRadius:"5px", fontSize:"0.72rem",
    fontFamily:"Space Grotesk,sans-serif", fontWeight:600, cursor:"pointer",
    border: active?"1px solid rgba(255,255,255,0.3)":"1px solid rgba(255,255,255,0.07)",
    background: active?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.03)",
    color: active?"#E8F0FF":"#5a6880", transition:"all 0.1s",
  });
  const card = { background:"#131720", border:"1px solid rgba(255,255,255,0.06)", borderRadius:"10px", padding:"16px 20px" };
  const seclabel = { fontSize:"0.58rem", color:"#3a4860", letterSpacing:"0.12em", fontFamily:"Inter,sans-serif", marginBottom:"8px" };

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:#0c0f15;}
        ::-webkit-scrollbar{width:4px;}
        ::-webkit-scrollbar-thumb{background:#2a3040;border-radius:2px;}
        input::placeholder{color:#3a4555;}
        input:focus{outline:none;border-color:rgba(255,255,255,0.2)!important;}
        .sugg:hover{background:rgba(255,255,255,0.08)!important;}
        input[type=range]{accent-color:#E8F0FF;}
      `}</style>

      <div style={{ minHeight:"100vh", background:"#0c0f15", padding:"20px 16px", display:"flex", flexDirection:"column", alignItems:"center", fontFamily:"Inter,sans-serif" }}>
        <div style={{ width:"100%", maxWidth:"680px" }}>

          <div style={{ marginBottom:"20px" }}>
            <h1 style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, fontSize:"1.4rem", color:"#E8F0FF", letterSpacing:"-0.02em" }}>
              Nuzlocke <span style={{ color:"#3a4860", fontWeight:400 }}>Schwarz 2</span>
            </h1>
            {/* Tab Navigation */}
            <div style={{ display:"flex", gap:"4px", marginTop:"12px" }}>
              {[["dex","🔍 Pokédex"],["bosse","⚔️ Bosskämpfe"],["routen","📍 Routen"]].map(([id,label])=>(
                <button key={id} onClick={()=>setActiveTab(id)} style={{
                  padding:"7px 14px", borderRadius:"6px", fontSize:"0.72rem",
                  fontFamily:"Space Grotesk,sans-serif", fontWeight:600, cursor:"pointer",
                  border: activeTab===id ? "1px solid rgba(255,227,78,0.4)" : "1px solid rgba(255,255,255,0.08)",
                  background: activeTab===id ? "rgba(255,227,78,0.1)" : "rgba(255,255,255,0.03)",
                  color: activeTab===id ? "#FFE34E" : "#5a6880", transition:"all 0.15s",
                }}>{label}</button>
              ))}
            </div>
          </div>

          {activeTab === "bosse" && <BossTab/>}
          {activeTab === "routen" && <RoutenTab/>}
          {activeTab === "dex" && (<div>

          {/* Suche */}
          <div style={{ position:"relative", marginBottom:"16px" }}>
            <input type="text" value={query}
              onChange={e=>{ setQuery(e.target.value); setSelected(null); }}
              placeholder="Pokémon auf Deutsch, Englisch oder Nummer…"
              style={{ width:"100%", background:"#131720", border:"1px solid rgba(255,255,255,0.08)", borderRadius:"8px", color:"#E8F0FF", fontSize:"0.95rem", fontFamily:"Space Grotesk,sans-serif", padding:"13px 16px" }}
            />
            {filtered.length>0 && !selected && (
              <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, zIndex:200, background:"#1a2030", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"8px", overflow:"hidden" }}>
                {filtered.map(p=>(
                  <div key={p[0]} className="sugg"
                    onClick={()=>{ setSelected(p); setQuery(`${p[2]} / ${p[1]}`); }}
                    style={{ padding:"10px 16px", cursor:"pointer", display:"flex", alignItems:"center", gap:"10px", borderBottom:"1px solid rgba(255,255,255,0.04)" }}>
                    <span style={{ color:"#2a3850", fontSize:"0.65rem", fontFamily:"monospace", width:"28px", flexShrink:0 }}>#{String(p[0]).padStart(3,"0")}</span>
                    <span style={{ color:"#E8F0FF", fontWeight:600, fontFamily:"Space Grotesk,sans-serif", fontSize:"0.9rem" }}>{p[2]}</span>
                    <span style={{ color:"#4a5870", fontSize:"0.8rem", fontFamily:"Space Grotesk,sans-serif" }}>{p[1]}</span>
                    <div style={{ marginLeft:"auto", display:"flex", gap:"4px" }}>
                      {p[5].map(t=><TypeBadge key={t} type={t} small/>)}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Liste — immer sichtbar, mit Icons */}
          <div style={{ marginBottom:"20px" }}>
            <button onClick={()=>setShowList(l=>!l)} style={{ background:"none", border:"1px solid rgba(255,255,255,0.07)", borderRadius:"6px", color:"#3a4860", fontSize:"0.65rem", letterSpacing:"0.1em", padding:"6px 12px", cursor:"pointer", fontFamily:"Inter,sans-serif", marginBottom:"8px" }}>
              {showList?"▲ LISTE VERBERGEN":"▼ ALLE POKÉMON IN BW2"}
            </button>
            {showList && (
              <div style={{ background:"#131720", border:"1px solid rgba(255,255,255,0.06)", borderRadius:"8px", maxHeight:"320px", overflowY:"auto", padding:"8px" }}>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))", gap:"2px" }}>
                  {BW2_POKEMON.map(pk=>(
                    <div key={pk[0]}
                      onClick={()=>{ setSelected(pk); setQuery(`${pk[2]} / ${pk[1]}`); setShowList(false); }}
                      style={{ padding:"5px 6px", borderRadius:"6px", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:"2px",
                        background: p && selected && p[0]===pk[0]?"rgba(255,227,78,0.1)":"transparent",
                        border: p && selected && p[0]===pk[0]?"1px solid rgba(255,227,78,0.3)":"1px solid transparent",
                      }}
                      onMouseEnter={e=>{ if(!(p&&p[0]===pk[0])) e.currentTarget.style.background="rgba(255,255,255,0.05)"; }}
                      onMouseLeave={e=>{ if(!(p&&p[0]===pk[0])) e.currentTarget.style.background="transparent"; }}>
                      <img
                        src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pk[0]}.png`}
                        alt={pk[2]} width={40} height={40}
                        style={{ imageRendering:"pixelated" }}
                      />
                      <div style={{ color:"#c0cfe0", fontSize:"0.62rem", fontFamily:"Space Grotesk,sans-serif", fontWeight:600, textAlign:"center", lineHeight:1.2 }}>{pk[2]}</div>
                      <div style={{ color:"#2a3850", fontSize:"0.52rem", fontFamily:"monospace" }}>#{String(pk[0]).padStart(3,"0")}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {p && (
            <div style={{ display:"flex", flexDirection:"column", gap:"14px" }}>

              {/* Header */}
              <div style={{ ...card, display:"flex", alignItems:"flex-start", gap:"16px" }}>
                {/* Gen-5-Sprite + Links */}
                <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"5px", flexShrink:0 }}>
                  <img
                    src={`https://img.pokemondb.net/sprites/black-white/normal/${toDbName(p[1])}.png`}
                    alt={p[1]}
                    style={{ width:80, height:80, imageRendering:"pixelated", filter:"drop-shadow(0 2px 10px rgba(0,0,0,0.7))" }}
                    onError={e => { e.target.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p[0]}.png`; }}
                  />
                  <a href={`https://pokemondb.net/sprites/${toDbName(p[1])}`} target="_blank" rel="noopener noreferrer"
                    style={{ fontSize:"0.52rem", color:"#3a6080", letterSpacing:"0.06em", fontFamily:"Inter,sans-serif", textDecoration:"none", border:"1px solid rgba(90,140,180,0.2)", borderRadius:"3px", padding:"2px 5px", whiteSpace:"nowrap" }}>
                    Sprites ↗
                  </a>
                  <a href={`https://www.pokewiki.de/${encodeURIComponent(p[2])}/Attacken#5._Generation`} target="_blank" rel="noopener noreferrer"
                    style={{ fontSize:"0.52rem", color:"#3a7050", letterSpacing:"0.06em", fontFamily:"Inter,sans-serif", textDecoration:"none", border:"1px solid rgba(90,180,140,0.2)", borderRadius:"3px", padding:"2px 5px", whiteSpace:"nowrap" }}>
                    Attacken ↗
                  </a>
                </div>

                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"baseline", gap:"8px", flexWrap:"wrap" }}>
                    <span style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, fontSize:"1.5rem", color:"#E8F0FF" }}>{p[2]}</span>
                    <span style={{ fontFamily:"Space Grotesk,sans-serif", color:"#3a4860", fontSize:"0.9rem" }}>{p[1]}</span>
                    <span style={{ color:"#1e2a3a", fontSize:"0.65rem", fontFamily:"monospace", marginLeft:"auto" }}>#{String(p[0]).padStart(3,"0")}</span>
                  </div>
                  <div style={{ display:"flex", gap:"6px", marginTop:"6px" }}>{p[5].map(t=><TypeBadge key={t} type={t}/>)}</div>
                  <div style={{ marginTop:"6px", display:"flex", gap:"12px", flexWrap:"wrap" }}>
                    <span style={{ fontSize:"0.65rem", color:"#3a4860", fontFamily:"Inter,sans-serif" }}>
                      Basis-KP: <span style={{ color:"#8a9aaa", fontWeight:600 }}>{p[4]}</span>
                    </span>
                    <span style={{ fontSize:"0.65rem", color:"#3a4860", fontFamily:"Inter,sans-serif" }}>
                      Catchrate: <span style={{ color: p[3]>=150?"#4CAF7D":p[3]>=45?"#F5A623":"#D64045", fontWeight:700 }}>{p[3]}</span>
                      <span style={{ color:"#2a3850" }}> ({p[3]>=200?"sehr leicht":p[3]>=100?"leicht":p[3]>=45?"mittel":p[3]>=10?"schwer":"sehr schwer"})</span>
                    </span>
                  </div>

                  {/* Entwicklungskette */}
                  <EvoChainDisplay currentId={p[0]} onSelect={pk=>{ setSelected(pk); setQuery(`${pk[2]} / ${pk[1]}`); }} />
                </div>
              </div>

              {/* Schwächen */}
              <div style={card}>
                <div style={seclabel}>TYP-MATCHUPS</div>
                <WeakRow label="4× SCHWACH" color="#ff6b6e" items={w4}/>
                <WeakRow label="2× SCHWACH" color="#ffaa77" items={w2}/>
                <WeakRow label="RESISTENZ (½× / ¼×)" color="#5ddb99" items={res}/>
                <WeakRow label="IMMUN (0×)" color="#445060" items={imm}/>
                {!w4.length&&!w2.length&&!res.length&&!imm.length&&<span style={{color:"#3a4860",fontSize:"0.75rem"}}>Keine Besonderheiten</span>}
              </div>

              {/* Fangrechner */}
              <div style={card}>
                <div style={seclabel}>FANGRECHNER (exakte Gen-V Formel)</div>

                <div style={{ marginBottom:"14px" }}>
                  <div style={{ fontSize:"0.65rem", color:"#5a6880", marginBottom:"6px" }}>Schnell-Presets</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:"5px" }}>
                    {PRESETS.map(pr => (
                      <button key={pr.label}
                        onClick={()=>{ setHpPct(pr.hp); setStatus(pr.status); }}
                        style={{ ...chip(hpPct===pr.hp && status===pr.status), fontSize:"0.65rem", padding:"4px 9px" }}>
                        {pr.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom:"14px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"6px" }}>
                    <span style={{ fontSize:"0.65rem", color:"#5a6880" }}>KP des Gegners</span>
                    <span style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, color:hpPct>66?"#D64045":hpPct>33?"#F5A623":"#4CAF7D", fontSize:"0.85rem" }}>{hpPct}%</span>
                  </div>
                  <input type="range" min={1} max={100} value={hpPct} onChange={e=>setHpPct(+e.target.value)} style={{ width:"100%" }}/>
                  <div style={{ display:"flex", justifyContent:"space-between", marginTop:"3px" }}>
                    <span style={{ fontSize:"0.55rem", color:"#2a3850" }}>1 KP</span>
                    <span style={{ fontSize:"0.55rem", color:"#2a3850" }}>Volle KP</span>
                  </div>
                </div>

                <div style={{ marginBottom:"14px" }}>
                  <div style={{ fontSize:"0.65rem", color:"#5a6880", marginBottom:"6px" }}>Status</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
                    {Object.entries(STATUS_DE).map(([k,v])=>(
                      <button key={k} onClick={()=>setStatus(k)} style={chip(status===k)}>{v}</button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom:"14px" }}>
                  <div style={{ fontSize:"0.65rem", color:"#5a6880", marginBottom:"6px" }}>Ball</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
                    {BALLS.map(b=>(
                      <button key={b.id} onClick={()=>setBall(b.id)} style={chip(ball===b.id)} title={b.hint||""}>{b.name}</button>
                    ))}
                  </div>
                  {selectedBall?.hint && <div style={{ marginTop:"6px", fontSize:"0.6rem", color:"#4a5870", fontFamily:"Inter,sans-serif" }}>ℹ {selectedBall.hint}</div>}
                </div>

                {/* Kontext-Optionen */}
                <div style={{ display:"flex", flexWrap:"wrap", gap:"6px", marginBottom:"14px" }}>
                  {(ball==="net"||ball==="dive") && <button onClick={()=>setIsWater(w=>!w)} style={chip(isWater)}>Im Wasser / Wasserpokémon</button>}
                  {ball==="dusk"   && <button onClick={()=>setIsCave(c=>!c)}    style={chip(isCave)}>In Höhle / nachts</button>}
                  {ball==="repeat" && <button onClick={()=>setOwned(o=>!o)}     style={chip(owned)}>Im Pokédex vorhanden</button>}
                  {ball==="quick"  && <button onClick={()=>setFirstTurn(f=>!f)} style={chip(firstTurn)}>1. Runde</button>}
                  {ball==="timer"  && (
                    <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
                      <span style={{ fontSize:"0.65rem", color:"#5a6880" }}>Runde {turn} → {Math.min(4,1+Math.floor(turn/10)).toFixed(1)}×</span>
                      <input type="range" min={1} max={30} value={turn} onChange={e=>setTurn(+e.target.value)} style={{ width:"100px" }}/>
                    </div>
                  )}
                </div>

                {/* Dunkles Gras */}
                <div style={{ marginBottom:"14px" }}>
                  <div style={{ fontSize:"0.65rem", color:"#5a6880", marginBottom:"6px" }}>Umgebung</div>
                  <button onClick={()=>setDarkGrass(d=>!d)} style={chip(darkGrass)}>⬛ Dunkles Hohes Gras</button>
                  {darkGrass && (
                    <div style={{ marginTop:"10px" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"4px" }}>
                        <span style={{ fontSize:"0.65rem", color:"#5a6880" }}>Pokémon im Pokédex</span>
                        <span style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, fontSize:"0.8rem",
                          color: caught<30?"#D64045":caught<151?"#F5A623":"#4CAF7D" }}>
                          {caught} → {darkGrassFactor(caught).toFixed(2)}×
                        </span>
                      </div>
                      <input type="range" min={0} max={649} value={caught} onChange={e=>setCaught(+e.target.value)} style={{ width:"100%" }}/>
                      <div style={{ fontSize:"0.6rem", color:"#2a3850", marginTop:"3px" }}>
                        {caught<30?"⚠ Unter 30: nur 0.3× – extrem schlechte Fangchancen!":
                         caught<151?"unter 150: 0.5×":
                         caught<301?"0.7×":caught<451?"0.8×":caught<601?"0.9×":"1.0×"}
                      </div>
                    </div>
                  )}
                </div>

                {/* Ergebnis */}
                <div style={{ background:"rgba(255,255,255,0.03)", borderRadius:"8px", padding:"14px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:"0.6rem", color:"#3a4860", letterSpacing:"0.1em", marginBottom:"4px" }}>FANGCHANCE</div>
                    <div style={{ fontSize:"0.72rem", color:"#5a6880" }}>
                      {selectedBall?.name} · {STATUS_DE[status]} · {hpPct}% KP
                    </div>
                    {!selectedBall?.master && (
                      <div style={{ fontSize:"0.65rem", color:"#3a4860", marginTop:"3px" }}>
                        Ball {typeof ballMult==="number"?`${ballMult.toFixed(2)}×`:"–"} · Status {STATUS_BONUS[status]}×{darkGrass?` · Dunkles Gras ${dgFactor.toFixed(2)}×`:""} 
                      </div>
                    )}
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontFamily:"Space Grotesk,sans-serif", fontWeight:700, fontSize:"2.4rem", color:pctColor, lineHeight:1 }}>
                      {selectedBall?.master?"100":catchPct?.toFixed(1)}%
                    </div>
                    <div style={{ fontSize:"0.62rem", color:"#2a3850", marginTop:"3px" }}>
                      {catchPct>=90?"Sicher":catchPct>=50?"Gut":catchPct>=20?"Riskant":"Sehr riskant"}
                    </div>
                  </div>
                </div>
              </div>

            </div>
          )}
        </div>)} {/* end dex tab */}
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(NuzlockeHelper));
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
